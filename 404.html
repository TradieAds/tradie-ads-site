<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Tradie Ads</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="4; url=/">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #070b14; --text: #eef2fb; --muted: #93a0bb; --blue: #1f5eff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px 16px;
    background: radial-gradient(700px 400px at 50% 40%, rgba(31,94,255,.25), transparent 70%), var(--bg);
    color: var(--text); font: 400 16px/1.6 Inter, system-ui, sans-serif; }
  img { height: 40px; width: auto; margin: 0 auto 32px; display: block; }
  h1 { font: 900 clamp(30px, 7vw, 48px)/1.1 Archivo, Inter, sans-serif; text-transform: uppercase; letter-spacing: -.02em; }
  p { color: var(--muted); margin: 14px auto 28px; max-width: 420px; }
  a.btn { display: inline-block; background: var(--blue); color: #fff; text-decoration: none; padding: 16px 26px; border-radius: 10px;
    font: 800 15px/1 Archivo, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
</style>
</head>
<body>
  <main>
